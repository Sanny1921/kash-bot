services:
  - type: web
    name: kash-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: kash
